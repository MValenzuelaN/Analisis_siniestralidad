[project]
name = "pyquarto"
version = "0.1.0"
description = "Plantilla base para reportes reproducibles con Quarto y Python"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.0.0",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "plotly>=6.5.2",
    "polars>=1.37.1",
    "pyarrow>=23.0.0",
    "scipy>=1.16.3",
    "tabulate>=0.9.0",
]
